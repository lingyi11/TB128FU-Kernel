name: Extract and Clean Kernel Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Process Archive
        run: |
          DOWNLOAD_URL="https://github.com/lllz95/TB128FU-Kernel/releases/download/s100021_230519/tb128fu_opensource_tb128fu_s100021_230519_row.tar.gz"
          
          echo "Downloading from $DOWNLOAD_URL ..."
          wget -q "$DOWNLOAD_URL" -O outer.tar.gz
          
          echo "Extracting outer layer (.tar.gz) ..."
          # 直接解压到 layer1 文件夹
          mkdir -p layer1
          tar -xzf outer.tar.gz -C layer1
          
          echo "Locating kernel-4.19.157 directory..."
          # 全局搜索 kernel-4.19.157 文件夹
          KERNEL_DIR=$(find layer1 -type d -name "kernel-4.19.157" | head -n 1)
          
          if [ -z "$KERNEL_DIR" ]; then
            echo "Error: Could not find kernel-4.19.157 directory!"
            echo "Here is the top-level structure of layer1:"
            ls -la layer1
            exit 1
          fi
          
          echo "Found kernel source at: $KERNEL_DIR"
          
          # 将内核源码暂存
          mkdir -p /tmp/final_source
          mv "$KERNEL_DIR"/* /tmp/final_source/
          mv "$KERNEL_DIR"/.* /tmp/final_source/ 2>/dev/null || true
          
          # 清理临时文件
          rm -rf outer.tar.gz layer1

      - name: Clean Workspace and Apply Source
        run: |
          cd $GITHUB_WORKSPACE
          # 保留 .git 和 .github 文件夹，清空其他
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          # 拷贝纯净源码到根目录
          cp -a /tmp/final_source/. .

      - name: Commit and Push to main branch
        run: |
          git config --global user.name "lllz95"
          git config --global user.email "lllz95@users.noreply.github.com"
          git config --global http.postBuffer 524288000
          
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "feat: import pristine kernel-4.19.157 source"
            git push origin HEAD:main --force
          fi
